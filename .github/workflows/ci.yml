name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DIFY_CLI_VERSION: "0.6.15"
  DIFY_CLI_SHA256: d0a1e3b25bd6c5f6cd749cad2cf04817ea808344e6cc07a2c49bb0108019ab93
  TOOLKIT_COMMIT: 83ee707c1dde758678f94a311f15b42d74f8c402

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest ruff pyyaml

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Validate YAML and manifest
        run: python -m pytest -q tests/test_manifest.py

      - name: Test
        run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the Dify plugin CLI (pinned, checksum verified)
        run: |
          mkdir -p .tools
          curl -fsSL --retry 3 -o .tools/dify \
            "https://github.com/langgenius/dify-plugin-daemon/releases/download/${DIFY_CLI_VERSION}/dify-plugin-linux-amd64"
          echo "${DIFY_CLI_SHA256}  .tools/dify" | sha256sum -c -
          chmod +x .tools/dify

      - name: Package
        run: |
          version=$(python -c "import yaml; print(yaml.safe_load(open('manifest.yaml'))['version'])" 2>/dev/null \
            || grep -m1 '^version:' manifest.yaml | awk '{print $2}')
          mkdir -p dist
          .tools/dify plugin package . -o "dist/ayinbox-${version}.difypkg"
          echo "PKG=dist/ayinbox-${version}.difypkg" >> "$GITHUB_ENV"

      - name: Check package contents
        run: |
          unzip -Z1 "$PKG" | sort | tee /tmp/contents.txt
          for required in manifest.yaml main.py requirements.txt README.md PRIVACY.md _assets/icon.svg provider/ayinbox.yaml; do
            grep -qx "$required" /tmp/contents.txt || { echo "missing $required"; exit 1; }
          done
          if grep -E '^(\.git/|\.github/|\.tools/|\.venv/|tests/|dist/)|__pycache__|\.pyc$|\.env$' /tmp/contents.txt; then
            echo "development files leaked into the package"; exit 1
          fi

      - name: Marketplace validator (dify-marketplace-toolkit)
        run: |
          git clone -q https://github.com/langgenius/dify-marketplace-toolkit.git /tmp/toolkit
          git -C /tmp/toolkit checkout -q "$TOOLKIT_COMMIT"
          yq --version
          python3 /tmp/toolkit/validator/validate-difypkg.py "$PKG" --toolkit-dir /tmp/toolkit --output-dir /tmp/validation
          cat /tmp/validation/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        with:
          name: ayinbox-difypkg
          path: dist/*.difypkg
          if-no-files-found: error

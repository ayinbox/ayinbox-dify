identity:
  name: update_contact
  author: ayinbox
  label:
    en_US: Update contact
    zh_Hans: 更新联系人
description:
  human:
    en_US: Change a contact's fields, merge custom fields, or mark it unsubscribed.
    zh_Hans: 修改联系人字段、合并自定义字段或将其标记为退订。
  llm: Updates one contact by id. Only the fields you pass change. custom_fields is merged into the existing ones.
    unsubscribe=true marks the contact unsubscribed; this tool never re-subscribes anyone and never changes campaign
    membership.
parameters:
- name: contact_id
  type: string
  required: true
  label:
    en_US: Contact id
    zh_Hans: 联系人 ID
  human_description:
    en_US: The contact's id (a UUID).
    zh_Hans: 联系人的 ID（UUID）。
  llm_description: The contact UUID, from search_contacts.
  form: llm
- name: email
  type: string
  required: false
  label:
    en_US: Email
    zh_Hans: 邮箱
  human_description:
    en_US: New email address.
    zh_Hans: 新的邮箱地址。
  llm_description: Optional new email address. Fails with contact_email_taken if another contact has it.
  form: llm
- name: first_name
  type: string
  required: false
  label:
    en_US: First name
    zh_Hans: 名
  human_description:
    en_US: First name.
    zh_Hans: 名。
  llm_description: Optional first name.
  form: llm
- name: last_name
  type: string
  required: false
  label:
    en_US: Last name
    zh_Hans: 姓
  human_description:
    en_US: Last name.
    zh_Hans: 姓。
  llm_description: Optional last name.
  form: llm
- name: company
  type: string
  required: false
  label:
    en_US: Company
    zh_Hans: 公司
  human_description:
    en_US: Company name.
    zh_Hans: 公司名称。
  llm_description: Optional company name.
  form: llm
- name: phone
  type: string
  required: false
  label:
    en_US: Phone
    zh_Hans: 电话
  human_description:
    en_US: Phone number.
    zh_Hans: 电话号码。
  llm_description: Optional phone number.
  form: llm
- name: custom_fields
  type: string
  required: false
  label:
    en_US: Custom fields (JSON)
    zh_Hans: 自定义字段（JSON）
  human_description:
    en_US: Optional JSON object of fields to set; other fields are kept.
    zh_Hans: 可选的字段 JSON 对象；其他字段保持不变。
  llm_description: Optional JSON object of custom fields to set. Merged into the contact's existing custom fields
    (needs READ_CONTACTS as well).
  form: llm
- name: unsubscribe
  type: boolean
  required: false
  label:
    en_US: Unsubscribe
    zh_Hans: 退订
  human_description:
    en_US: Mark the contact as unsubscribed.
    zh_Hans: 将联系人标记为已退订。
  llm_description: Set true only when the person asked not to be contacted.
  form: llm
- name: idempotency_key
  type: string
  required: false
  label:
    en_US: Idempotency key
    zh_Hans: 幂等键
  human_description:
    en_US: Optional. Repeating a call with the same key within 24 hours does not apply the change twice.
    zh_Hans: 可选。24 小时内使用相同的键重复调用不会重复执行更改。
  llm_description: Optional unique string (for example a UUID). Reuse the same value only when retrying the same
    call. A call with a key is retried safely on temporary errors; a call without one is not.
  form: llm
extra:
  python:
    source: tools/update_contact.py
